server {
    listen 80;
    
    # La carpeta donde Vite tira los archivos compilados
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Intenta buscar el archivo, si no lo encuentra busca un directorio, y si no, carga el index.html
        try_files $uri $uri/ /index.html;
    }

    # Páginas de error por defecto
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}